name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    runs-on: ubuntu-latest
    outputs:
      testflight: ${{ steps.paths.outputs.testflight }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Lint
        run: ./gradlew ktlintCheck detekt
      - name: Test (Android host + wasm)
        run: ./gradlew allTests
      - name: Build Android + web
        run: >-
          ./gradlew
          :apps:recipes:androidApp:assembleDebug :apps:transit:androidApp:assembleDebug
          :apps:recipes:wasmJsBrowserDistribution :apps:transit:wasmJsBrowserDistribution
      - name: Check TestFlight paths
        if: github.event_name == 'pull_request'
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA"...HEAD -- \
            apps/ core/ iosApp/ build-logic/ gradle/ ':(top,glob)*.gradle.kts' gradle.properties \
            .github/workflows/testflight.yml .github/scripts/testflight-notes.mjs > "$RUNNER_TEMP/testflight-paths"
          if [ -s "$RUNNER_TEMP/testflight-paths" ]; then
            echo "testflight=true" >> "$GITHUB_OUTPUT"
          fi

  ios:
    needs: kotlin
    uses: ./.github/workflows/ios.yml

  testflight:
    needs: [kotlin, ios]
    if: github.event_name == 'pull_request' && needs.kotlin.outputs.testflight == 'true'
    uses: ./.github/workflows/testflight.yml
    secrets: inherit

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
